# Derive the per-request CSP nonce ONCE. A map variable is evaluated lazily and
# cached for the whole request — surviving the internal redirect to /index.html —
# so the CSP header and the sub_filter body rewrite see the SAME value. A plain
# `set $csp_nonce $request_id` re-runs after that redirect and yields a SECOND,
# different id, so the header nonce and the <meta>/emotion nonce disagree and the
# browser blocks every injected style.
#
# THIS NONCE IS STYLE-SCOPED. Do not reuse it for script-src (#696).
#
# Two independent reasons, either of which is disqualifying:
#
#   1. It is published to the DOM. sub_filter writes it into
#      <meta name="csp-nonce"> so main.tsx can hand it to Emotion, which means
#      any script that can read the document can read the nonce and stamp it on
#      an injected <script>. A script nonce an attacker can read authorises the
#      attacker. That is fine for style-src, whose threat model here is
#      Emotion's injected <style> tags, and fatal for script-src.
#
#   2. It comes from nginx's $request_id, which is a request identifier from
#      nginx's internal PRNG, not a CSPRNG (CWE-330). Script nonces must be
#      unpredictable.
#
# script-src stays 'self'. That is STRONGER than a nonce built this way, not a
# placeholder for one. Adopting script nonces properly means a
# cryptographically-random source (njs/Lua, or a value minted upstream) AND
# dropping the <meta> publication in favour of a server-rendered inline
# bootstrap -- i.e. a different design, not an edit to this line.
map $request_id $csp_nonce {
    default $request_id;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Drop the backend's own copies of the six security headers before adding ours
    # below (#743).
    #
    # The backend runs SecurityHeadersMiddleware on every response, so on a proxied
    # path both it and nginx emitted these and the browser received BOTH. Observed:
    #
    #   x-frame-options:  "DENY, DENY"
    #   referrer-policy:  "no-referrer, strict-origin-when-cross-origin"
    #
    # The second is the reason this is a defect rather than untidiness. The backend
    # deliberately sends the stricter `no-referrer` for API responses, and
    # Referrer-Policy resolution takes the LAST value the agent understands -- so
    # nginx's looser value silently overrode the backend's stricter intent. A
    # repeated X-Frame-Options is also not well specified and browsers have treated
    # duplicates as invalid, i.e. the clickjacking control became unreliable rather
    # than doubled.
    #
    # nginx is the outermost hop whenever it is in the path, so it is made the single
    # authority here. The backend keeps sending its own headers, deliberately: it is
    # the ONLY emitter in the topology where the ALB routes /api/* straight to the
    # backend target group and nginx never sees the request (see
    # nginx-ecs.conf.template). Stripping them upstream would silently unprotect that
    # deployment.
    #
    # Declared once at server level. proxy_hide_header inherits into every location
    # that does not declare its own -- unlike add_header, none of the proxied
    # locations below do -- so this covers all ten without repetition. Verified
    # against real nginx rather than assumed.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # This server block terminates TLS directly (see ssl_certificate above), so it is
    # the right hop to send HSTS from. If you instead front this container with an
    # external reverse proxy/ALB for TLS termination (as docker-compose.prod.yml
    # recommends), configure HSTS there instead -- this header never reaches the
    # browser when this container only serves plain HTTP behind that proxy.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # CSP: nonce-based for style-src to avoid 'unsafe-inline' (MUI/Emotion uses nonce)
    # The __CSP_NONCE__ placeholder is replaced per-request by the sub_filter below.
    # In development (without nginx), 'unsafe-inline' is still needed — Vite injects styles directly.
    # $csp_nonce is the single per-request value from the map above.
    # connect-src 'self' also constrains VITE_SENTRY_DSN / VITE_ERROR_REPORTING_DSN /
    # VITE_PERFORMANCE_DSN (services/errorReporting.ts, performanceReporting.ts): a
    # genuinely cross-origin DSN (e.g. a Sentry SaaS *.ingest.sentry.io endpoint) will
    # have its fetch/sendBeacon calls silently blocked by the browser. Route such DSNs
    # through this reverse proxy instead, or add their origin here (see ARCHITECTURE.md).
    #
    # img-src is an ALLOWLIST, not a wildcard (#680). READMEs are publisher-authored, and
    # under the previous `https:` an embedded image was a working analytics pixel: the
    # publisher's own host learned the viewer's IP, User-Agent and timestamp on every page
    # view, with no XSS required.
    #
    # The selection rule is "hosts whose access logs the publisher cannot read", which is
    # what actually removes the tracking primitive. A badge served from img.shields.io or an
    # image from raw.githubusercontent.com still loads, but the logs land with shields.io or
    # GitHub -- not with whoever wrote the README. Only a publisher-controlled origin gives
    # them the viewer's identity, and that is precisely what is now excluded.
    #
    # Consequence to know before adding a host: remote images hosted anywhere else -- a
    # self-hosted architecture diagram on a publisher's own domain, most commonly -- now
    # fail to load, reported as a CSP violation in the browser console. That is a deliberate
    # trade, not an oversight. Add a host here only if the publisher cannot read its logs;
    # adding one they control reopens the exact hole this closes.
    #
    # The complete fix is proxying README images through the backend (GitHub's camo model),
    # which keeps every image working AND removes the disclosure. That is backend work and
    # is not done here. Documented for end users in PRIVACY.md section 8.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$csp_nonce'; img-src 'self' data: https://img.shields.io https://badgen.net https://raw.githubusercontent.com https://avatars.githubusercontent.com https://github.com https://gitlab.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Inject CSP nonce into index.html so the React app can read it. once off =
    # replace EVERY __CSP_NONCE__ so the <meta> is covered even if another
    # occurrence precedes it in the document.
    sub_filter_once off;
    sub_filter '__CSP_NONCE__' '$csp_nonce';

    # Upload size limit (matches backend: 100MB modules, 500MB providers)
    client_max_body_size 512m;

    # SPA fallback - serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend (plain HTTP — backend has no TLS)
    # Mirror sync operations (provider and Terraform binary) can take several
    # minutes to download; both sync endpoints need the same carve-out (#599).
    location ~* ^/api/v1/admin/(mirrors|terraform-mirrors)/[^/]+/sync$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger JSON spec to backend
    location /swagger.json {
        proxy_pass http://backend:8080/swagger.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Terraform protocol requests to backend
    location /v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy service discovery
    location /.well-known/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy webhook endpoints
    location /webhooks/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy network mirror endpoints
    location /terraform/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx add_header is REPLACE-BY-LEVEL, not additive: "these directives are
        # inherited from the previous configuration level if and only if there are
        # no add_header directives defined on the current level". This location
        # defines its own, so without re-declaring them here it would serve with
        # NONE of the six server-level security headers.
        #
        # This is the one same-origin path carrying content the operator does not
        # author -- /terraform/ is the network-mirror protocol, proxying provider
        # metadata from third-party upstream registries -- so it is the worst
        # place in the config to lose nosniff and the CSP.
        #
        # Duplication here is deliberate and guarded: nginxHeaderInheritance.test.ts
        # fails if any location that defines add_header omits one of these.
        #
        # Do NOT add_header Content-Type here. add_header APPENDS, so it does not
        # override the upstream's own Content-Type -- it emits both, comma-joined,
        # and Terraform rejects the mirror with "unexpected content after media
        # subtype". The backend already sets application/json.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$csp_nonce'; img-src 'self' data: https://img.shields.io https://badgen.net https://raw.githubusercontent.com https://avatars.githubusercontent.com https://github.com https://gitlab.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # Health and readiness pass-through
    location /health {
        proxy_pass http://backend:8080/health;
    }

    location /ready {
        proxy_pass http://backend:8080/ready;
    }

    location /version {
        proxy_pass http://backend:8080/version;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
