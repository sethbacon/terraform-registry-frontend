# Minimal stack for the contract-check CI job. Brings up postgres + backend
# only — no frontend build, no seed-db (no auth needed for /swagger.json or
# /health). Pin the backend image at a known-good tag; bump via PR when
# the frontend wants to use a newer backend API surface.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: terraform_registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d terraform_registry"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    # Pinned backend image. Bump this tag in lockstep with backend releases
    # whose API surface the frontend wants to depend on. The contract check
    # validates that every route api.ts calls exists on this exact backend.
    #
    # 4.20.0 carries the Entra credential-type work (backend #1037/#1041) and
    # the platform-admin carrier API (backend #766), which had been allowlisted
    # ever since it merged.
    #
    # KEEP THIS CURRENT. A stale pin fails nothing by itself -- it quietly
    # weakens the check, because every route added since the pin must be
    # allowlisted for a PR to go green, and each allowlist entry is a route
    # nothing verifies. This sat at 3.5.2 while the backend reached 4.20.0 (one
    # major and fifteen minors), and three platform-admin entries were dead
    # weight for that whole time. contract-check.ts fails on a STALE ENTRY once
    # the pin moves, which is the cleanup lever; the pin itself has no such
    # lever, so bumping it is a deliberate maintenance task -- see the
    # contract-check-pin-currency test for the floor that now enforces it.
    image: ${BACKEND_IMAGE:-ghcr.io/sethbacon/terraform-registry-backend:4.20.0}
    environment:
      - TFR_DATABASE_HOST=postgres
      - TFR_DATABASE_PORT=5432
      - TFR_DATABASE_NAME=terraform_registry
      - TFR_DATABASE_USER=registry
      - TFR_DATABASE_PASSWORD=registry
      - TFR_DATABASE_SSL_MODE=disable
      - TFR_SERVER_HOST=0.0.0.0
      - TFR_SERVER_PORT=8080
      # Test-only secrets; never used in production. The encryption key must
      # look CSPRNG-generated — the backend refuses to boot on low-entropy
      # keys (its issue #560), so an all-zeros placeholder fails startup.
      - TFR_JWT_SECRET=test-jwt-secret-for-contract-check-only
      - ENCRYPTION_KEY=b8aa8087d97d609b15d2f818dd9ddb9e
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
