version: 2

# The shared suite UI package is public on npmjs, so the frontend tree needs no
# registry credentials. The package itself is still excluded from automated
# version updates below: it is released and pinned in lockstep with the suite,
# out of band.
updates:
  # ---------------------------------------------------------------------------
  # npm (frontend/)
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # Public on npmjs and peer-only (zero runtime deps), so patch/minor can
      # flow like any other dependency — nothing else would ever surface a fix
      # in the shared UI here. Majors stay manual because its peerDependencies
      # pin the react/MUI/react-router ranges this app has to satisfy; a
      # react-router major already broke this pin once (#643).
      - dependency-name: "@4cloudguru/*"
        update-types: ["version-update:semver-major"]
      # Major React/MUI bumps require manual migration work.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/material"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/icons-material"
        update-types: ["version-update:semver-major"]
      # Major TypeScript bumps break the toolchain before app code: tsup's
      # bundled rollup-plugin-dts and @typescript-eslint/typescript-estree
      # both crash against TS7's changed internals (2026-07-13 incident).
      # Revisit once both ship TS7-compatible releases.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # npm (e2e/)
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - javascript
      - e2e
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-e2e-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # Docker (frontend/)
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The node builder major is tied to package.json `engines`; Dependabot has
      # no visibility of that, and #547 silently moved it 24 -> 26. Digest and
      # minor updates still flow. Raise the major here and in `engines` together.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
