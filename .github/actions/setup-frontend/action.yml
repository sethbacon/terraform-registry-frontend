---
name: Setup frontend
description: >-
  Node.js + npm cache and optional dependency installs shared across all
  frontend workflows. The calling job must run actions/checkout first —
  this action does not include a checkout step.

inputs:
  node-version:
    description: Node.js version.
    required: false
    default: "24"
  install-deps:
    description: Run `npm ci` in frontend/.
    required: false
    default: "true"
  install-e2e-deps:
    description: Run `npm ci` in e2e/.
    required: false
    default: "false"
  install-playwright:
    description: Run `npx playwright install --with-deps` in e2e/.
    required: false
    default: "false"
  playwright-browsers:
    description: Browsers to pass to `playwright install` (space-separated).
    required: false
    default: "chromium"

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      if: inputs.install-deps == 'true'
      working-directory: frontend
      shell: bash
      run: npm ci

    # The library publishes a SLSA provenance attestation bound to the packed tarball. Without
    # this, the attestation is an audit trail nobody reads; here it gates the build. Verified
    # locally before adding: a genuine tarball passes, and one with a single appended byte fails
    # with HTTP 404 for its altered digest.
    - name: Verify @4cloudguru/cloud-suite-ui provenance
      if: inputs.install-deps == 'true'
      working-directory: frontend
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version=$(node -p "require('./package.json').dependencies['@4cloudguru/cloud-suite-ui']")
        tmp=$(mktemp -d)
        tarball=$(basename "$(npm pack "@4cloudguru/cloud-suite-ui@${version}" --silent --pack-destination "$tmp" | tail -n1)")
        gh attestation verify "${tmp}/${tarball}" --repo 4cloudguru/cloud-suite-ui
        rm -rf "$tmp"

    - name: Install e2e dependencies
      if: inputs.install-e2e-deps == 'true'
      working-directory: e2e
      shell: bash
      run: npm ci

    - name: Install Playwright browsers
      if: inputs.install-playwright == 'true'
      working-directory: e2e
      shell: bash
      # The input goes through env rather than straight into the command line.
      # Interpolated directly, a caller-supplied value is concatenated into the
      # shell before bash ever sees it, so anything with a `;` or backtick runs
      # as a command. Every caller today passes a fixed string, which makes this
      # latent rather than live -- but the fix costs nothing and the property
      # should hold regardless of who calls it next.
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
      run: npx playwright install --with-deps ${PLAYWRIGHT_BROWSERS}
