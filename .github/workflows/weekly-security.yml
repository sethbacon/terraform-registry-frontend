---
name: Weekly Security Scan

# Runs the full CI suite plus extended security checks every Monday.
# Uses ci.yml via workflow_call so all logic lives in one place; no
# duplicated steps.  Failures open a GitHub issue.
"on":
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ── Full CI ────────────────────────────────────────────
  # Calls ci.yml, which requests `packages: read` to pull the ghcr.io
  # backend image used by the Contract Check job. A reusable workflow can
  # only request permissions the caller has already granted, so we elevate
  # explicitly here.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # No `secrets:` needed here (#613): ci.yml's only secret-consuming step
    # (GIST_TOKEN for the coverage badge) is gated to `push`/`workflow_dispatch`
    # events, neither of which is true on this workflow_call path, so nothing
    # in ci.yml actually reads an inherited secret when invoked from here.
    permissions:
      contents: read
      packages: read

  # ── Dependency Audit ──────────────────────────────────
  npm-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # Same sibling defect as pr-checks.yml's npm-audit job (#598): without
    # an explicit grant, this job only has the workflow-level `contents:
    # read`, and setup-frontend's default `npm ci` needs packages:read to
    # authenticate to npm.pkg.github.com for @sethbacon/terraform-suite-ui.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-frontend
        with:
          install-e2e-deps: "true"

      # Same triage the per-PR gate uses (frontend/scripts/audit-gate.mjs):
      # blocks only on advisories that reach production AND have a non-breaking
      # fix. Everything else — dev-only packages, advisories with no published
      # fix or only a breaking one, and documented accepted risks — is reported
      # as a warning and in the job summary. Keeping this identical to
      # pr-checks.yml matters: if the weekly run failed on findings the PR gate
      # deliberately tolerates, it would sit permanently red and get ignored.
      - name: Audit frontend dependencies
        run: |
          (cd frontend && npm audit --json > "$RUNNER_TEMP/frontend-audit.json") || true
          node frontend/scripts/audit-gate.mjs "$RUNNER_TEMP/frontend-audit.json" \
            --exceptions frontend/scripts/npm-audit-exceptions.json

      - name: Audit e2e dependencies
        run: |
          (cd e2e && npm audit --json > "$RUNNER_TEMP/e2e-audit.json") || true
          node frontend/scripts/audit-gate.mjs "$RUNNER_TEMP/e2e-audit.json" \
            --exceptions frontend/scripts/npm-audit-exceptions.json

  # ── OSV Scan ──────────────────────────────────────────
  osv-scan:
    name: OSV Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run OSV Scanner
        # v2.3.8
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2
        continue-on-error: true
        with:
          # JSON so the triage step below can classify findings; it prints a
          # readable summary in place of the table.
          scan-args: |-
            --format=json
            --output=osv-results.json
            --lockfile=frontend/package-lock.json
            --lockfile=e2e/package-lock.json

      # Triaged through the same gate the npm-audit jobs use, against the same
      # exceptions file, so the two scanners cannot reach opposite conclusions
      # about one advisory. Blocking is reserved for advisories that have a
      # non-breaking fix; ones with no published fix, ones fixable only by a
      # semver-major, and documented accepted risks are reported as warnings.
      #
      # Without this the weekly run failed indefinitely on GHSA-qwww-vcr4-c8h2
      # (react-router): OSV lists a fix of 8.3.0, but that is a breaking major
      # that also breaks the @sethbacon/terraform-suite-ui pin, so the job was
      # red every week with no action anyone could take (issue #643).
      - name: Triage OSV findings
        run: node frontend/scripts/audit-gate.mjs osv-results.json \
          --exceptions frontend/scripts/npm-audit-exceptions.json

  # ── CodeQL ────────────────────────────────────────────
  # Scans the application source (javascript-typescript), the repo's GitHub
  # Actions workflows (actions), and the wiki-sync helper script (python).
  # The `actions` leg is required to keep the code-scanning tool-status
  # configuration for this workflow current: a previously-registered `actions`
  # configuration reports a stale "configuration error" on the Code scanning
  # status page when no analysis refreshes it. `python` was added to close a
  # coverage gap flagged on the Code scanning overview page (scripts/sync-wiki.py
  # was auto-detected as an analyzable language but never actually scanned).
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        # v4
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        # v4
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81

      - name: Analyze
        # v4
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          category: /language:${{ matrix.language }}

  # ── Flag stale Dependabot PRs ──────────────────────────
  stale-dependabot:
    name: Flag stale Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label Dependabot PRs open >14 days (lockfile changes)
        # v8
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 14);
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            for (const pr of prs.data) {
              if (pr.user.login !== 'dependabot[bot]') continue;
              if (new Date(pr.created_at) > cutoff) continue;
              const files = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              const touchesLockfile = files.data.some(f =>
                f.filename === 'frontend/package-lock.json' ||
                f.filename === 'e2e/package-lock.json'
              );
              if (!touchesLockfile) continue;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['stale-security-patch'],
              });
            }

  # ── Notify on schedule failures ───────────────────────
  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    needs: [ci, npm-audit, osv-scan, codeql, stale-dependabot]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        # v8
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = `Weekly security scan failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Weekly Security Scan Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The weekly security scan failed. Please investigate before the next release.',
              '',
              'Common causes:',
              '- A new high/critical CVE in a transitive npm dependency',
              '- OSV Scanner flagged a known-vulnerable package version',
              '- CodeQL found a security-and-quality issue in new code',
              '- A Dependabot security PR has been open for more than 14 days',
              '- The Node.js 22 base image changed in a breaking way',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci'],
            });
