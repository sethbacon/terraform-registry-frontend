---
name: Weekly Security Scan

# Runs the full CI suite plus extended security checks every Monday.
# Uses ci.yml via workflow_call so all logic lives in one place; no
# duplicated steps.  Failures open a GitHub issue.
"on":
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ── Full CI ────────────────────────────────────────────
  # Calls ci.yml, which requests `packages: read` to pull the ghcr.io
  # backend image used by the Contract Check job. A reusable workflow can
  # only request permissions the caller has already granted, so we elevate
  # explicitly here.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # No `secrets:` passed here (#613): ci.yml's only secret-consuming step is
    # the GIST_TOKEN coverage badge, which this workflow has no reason to
    # update.
    #
    # NOTE: the original justification for this was wrong. It claimed the
    # badge step's `push`/`workflow_dispatch` event gate could never be true on
    # a workflow_call path — but a reusable workflow sees the CALLER's
    # `github.event_name`, so it IS true here (tag push for release.yml, manual
    # dispatch for weekly-security.yml) and the step failed with
    # "Missing auth secret". ci.yml now also requires the token to be non-empty,
    # so omitting secrets skips the step instead of failing the job.
    permissions:
      contents: read
      packages: read

  # ── Dependency Audit ──────────────────────────────────
  npm-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
        with:
          install-e2e-deps: "true"

      # Same triage the per-PR gate uses (frontend/scripts/audit-gate.mjs):
      # blocks only on advisories that reach production AND have a non-breaking
      # fix. Everything else — dev-only packages, advisories with no published
      # fix or only a breaking one, and documented accepted risks — is reported
      # as a warning and in the job summary. Keeping this identical to
      # pr-checks.yml matters: if the weekly run failed on findings the PR gate
      # deliberately tolerates, it would sit permanently red and get ignored.
      - name: Audit frontend dependencies
        run: |
          (cd frontend && npm audit --json > "$RUNNER_TEMP/frontend-audit.json") || true
          node frontend/scripts/audit-gate.mjs "$RUNNER_TEMP/frontend-audit.json" \
            --exceptions frontend/scripts/npm-audit-exceptions.json

      - name: Audit e2e dependencies
        run: |
          (cd e2e && npm audit --json > "$RUNNER_TEMP/e2e-audit.json") || true
          node frontend/scripts/audit-gate.mjs "$RUNNER_TEMP/e2e-audit.json" \
            --exceptions frontend/scripts/npm-audit-exceptions.json

  # ── OSV Scan ──────────────────────────────────────────
  osv-scan:
    name: OSV Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # `security-events: write` used to be requested here and was never used:
      # nothing in this job uploads SARIF (the scan writes JSON for the triage
      # gate below). Findings surfaced nowhere as a result -- no alert, no
      # issue, no notification (#780). It is replaced by the permission the job
      # actually needs to reach a human.
      contents: read # checkout
      issues: write # the tracking issue maintained by "Report OSV findings"
    steps:
      # hardening-exception: egress-audit — this job queries the OSV vulnerability
      #   database, calls the GitHub API, and clones this repository; harden-runner
      #   has never run in this repository, so no endpoint baseline exists and a block
      #   policy written without one fails closed on its first run; audit is what
      #   produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV Scanner
        # v2.3.8
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        continue-on-error: true
        with:
          # JSON so the triage step below can classify findings; it prints a
          # readable summary in place of the table.
          scan-args: |-
            --format=json
            --output=osv-results.json
            --lockfile=frontend/package-lock.json
            --lockfile=e2e/package-lock.json

      # Maintains ONE tracking issue naming the advisories, found by the
      # `osv-report` label rather than by title. Runs BEFORE the gate below so a
      # blocking finding is filed as well as failing the job, and with
      # `always()` so it still files when the scan step itself failed.
      #
      # The logic lives in a repo script rather than inline YAML so it is
      # covered by the unit suite (frontend/scripts/__tests__/osv-report.test.ts)
      # against real scanner output, instead of only ever running in production.
      - name: Report OSV findings
        if: always() && steps.osv.outcome != 'skipped'
        # v8
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Passed through env, not `${{ }}` inside `script:`, which would be a
          # template-injection sink. A non-zero scanner exit with no findings at
          # all is a scan that did not happen; the filer refuses to report clean.
          OSV_SCAN_OUTCOME: ${{ steps.osv.outcome }}
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/frontend/scripts/osv-report.mjs`);
            await run({ github, context, core });

      # Triaged through the same gate the npm-audit jobs use, against the same
      # exceptions file, so the two scanners cannot reach opposite conclusions
      # about one advisory. Blocking is reserved for advisories that have a
      # non-breaking fix; ones with no published fix, ones fixable only by a
      # semver-major, and documented accepted risks are reported as warnings.
      #
      # Without this the weekly run failed indefinitely on GHSA-qwww-vcr4-c8h2
      # (react-router): OSV lists a fix of 8.3.0, but that is a breaking major
      # that also breaks the @4cloudguru/cloud-suite-ui pin, so the job was
      # red every week with no action anyone could take (issue #643).
      - name: Triage OSV findings
        run: node frontend/scripts/audit-gate.mjs osv-results.json \
          --exceptions frontend/scripts/npm-audit-exceptions.json

  # ── CodeQL ────────────────────────────────────────────
  # Scans the application source (javascript-typescript), the repo's GitHub
  # Actions workflows (actions), and the wiki-sync helper script (python).
  # The `actions` leg is required to keep the code-scanning tool-status
  # configuration for this workflow current: a previously-registered `actions`
  # configuration reports a stale "configuration error" on the Code scanning
  # status page when no analysis refreshes it. `python` was added to close a
  # coverage gap flagged on the Code scanning overview page (scripts/sync-wiki.py
  # was auto-detected as an analyzable language but never actually scanned).
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, python]
    steps:
      # hardening-exception: egress-audit — this job downloads the CodeQL bundle and
      #   its query packs and clones this repository; harden-runner has never run in
      #   this repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # v4
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        # v4
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      - name: Analyze
        # v4
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}

  # ── Flag stale Dependabot PRs ──────────────────────────
  stale-dependabot:
    name: Flag stale Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Label Dependabot PRs open >14 days (lockfile changes)
        # v8
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 14);
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            for (const pr of prs.data) {
              if (pr.user.login !== 'dependabot[bot]') continue;
              if (new Date(pr.created_at) > cutoff) continue;
              const files = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              const touchesLockfile = files.data.some(f =>
                f.filename === 'frontend/package-lock.json' ||
                f.filename === 'e2e/package-lock.json'
              );
              if (!touchesLockfile) continue;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['stale-security-patch'],
              });
            }

  # ── Notify on schedule failures ───────────────────────
  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ci, npm-audit, osv-scan, codeql, stale-dependabot]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
      actions: read # list this run's jobs, to name what actually failed
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Create failure issue
        # v8
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Name the failure instead of guessing at it.
            //
            // This step used to emit a fixed template listing five "common
            // causes" and never looked at which job failed. Because `ci` is one
            // of its `needs`, a red E2E test filed an issue titled "Weekly
            // security scan failed" whose every listed cause was wrong -- see
            // #807, where OSV had in fact exited 0 and the real failure was a
            // Playwright upload test. Ten such issues exist historically, two of
            // them filed on the same day, because nothing deduplicated this path
            // either (#784 deduplicated the OSV filer, not this one).
            // Identify security jobs STRUCTURALLY rather than by name matching.
            // `needs` is [ci, npm-audit, osv-scan, codeql, stale-dependabot], so
            // everything except `ci` is a security job. Matching on names is what
            // a first draft of this did, and it silently failed: the job id
            // `npm-audit` has the display name "Dependency Audit", so the check
            // would have classed a real audit failure as a mere build break.
            // Jobs from the called `ci.yml` surface as "CI / <job name>".
            const isCiJob = (n) => n === 'CI' || n.startsWith('CI / ');

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId },
            );
            const failed = jobs.filter((j) => j.conclusion === 'failure');

            // Report the failing STEP too: "CI failed" is a category, "CI /
            // Run Playwright tests failed" is a lead.
            const describe = (j) => {
              const step = (j.steps || []).find((s) => s.conclusion === 'failure');
              return step ? `**${j.name}** — step \`${step.name}\`` : `**${j.name}**`;
            };

            // A security job failing and the build merely being broken are
            // different events and should not share a title.
            const securityFailed = failed.some((j) => !isCiJob(j.name));
            const kind = securityFailed ? 'Weekly security scan failed' : 'Weekly scheduled run failed';
            const marker = kind;

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'bug,ci',
            });
            if (open.some((i) => i.title.startsWith(marker))) {
              core.info(`An open "${marker}" issue already exists — skipping duplicate.`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## ${kind}`,
              '',
              `**Workflow run:** ${runUrl}`,
              '',
              failed.length
                ? ['These jobs failed:', '', ...failed.map((j) => `- ${describe(j)}`)].join('\n')
                : 'No job reported a failure conclusion, which usually means a job was cancelled or timed out. Check the run.',
              '',
              securityFailed
                ? 'At least one security job is among them — treat as a security finding until triaged.'
                : 'No security job failed. This is a build or test failure surfaced by the scheduled run, not a vulnerability.',
              '',
              'Note: `continue-on-error` makes a failed step report `conclusion: success`, so read the step logs rather than the conclusions when a job looks green but behaved otherwise.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${kind} — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['bug', 'ci'],
            });
