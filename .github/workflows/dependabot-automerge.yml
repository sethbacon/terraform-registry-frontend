name: Dependabot Auto-Merge

# Two independent Dependabot mechanisms feed this workflow, both opening PRs as
# github.actor == 'dependabot[bot]' with no first-class signal distinguishing them:
#   - Security updates: a native GitHub feature (Settings -> Code security) that
#     reacts to GHSA advisories in real time, always one PR per dependency.
#   - Version updates: this repo's .github/dependabot.yml biweekly schedule.
#
# The only reliable way to tell them apart is fetch-metadata's alert-lookup, which
# needs a token with "Dependabot alerts: read" -- the ambient secrets.GITHUB_TOKEN
# is documented as insufficient for that GraphQL lookup. A GitHub App installation
# token (DEPENDABOT_APP_ID / DEPENDABOT_APP_PRIVATE_KEY secrets) provides that one
# narrow, read-only permission; see the setup steps in PR #519's description.
#
# Once alert-state is known, two distinct policies apply:
#   - Security-driven fixes (alert-state == OPEN): auto-merge patch OR minor bumps
#     of direct-production deps. Some advisories are only patched starting at a
#     minor version if the maintainer didn't backport a fix -- restricting
#     security auto-merge to patch-only would silently skip exactly the fixes
#     this automation exists for. Major bumps still always require manual review.
#   - Routine version bumps (no open alert): auto-merge patch-only,
#     direct-production only -- unchanged from the original, more conservative
#     default that isn't specifically security-motivated.
#
# Trigger: GitHub always runs `pull_request`-triggered workflows for
# Dependabot PRs with a read-only GITHUB_TOKEN and no secrets, regardless of
# the `permissions:`/secrets declared below -- so this job could never
# actually complete a merge (#597). `pull_request_target` runs in the
# context of the base repository instead, so it gets the real token and
# secrets. That's normally risky for PR automation because it can check out
# and execute untrusted PR code with elevated privileges, but this workflow
# never checks out the PR head (no `actions/checkout` step at all), so there
# is no untrusted code execution here.
on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Generate a Dependabot-alerts-read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `client-id` + `vars.`, matching release-please.yml and every other
          # app-token step in the suite. This step alone said
          # `app-id: ${{ secrets.DEPENDABOT_APP_ID }}`, and the ID is a repository
          # VARIABLE, not a secret -- so the expression resolved to empty and the
          # step failed every run with "must be set to a non-empty string".
          client-id: ${{ vars.DEPENDABOT_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          alert-lookup: true

      - name: Auto-merge security-driven patch/minor updates
        # package-ecosystem == 'npm_and_yarn' excludes github-actions (and
        # docker) bumps (#612): action deps have no dev/prod split, so a
        # workflow-file version bump would otherwise likely qualify as
        # direct:production and ride this same unreviewed path, granting a
        # compromised action full repo secrets on every subsequent run.
        # Always require human review for those regardless of semver level.
        # 'npm_and_yarn' is fetch-metadata's runtime package-manager
        # identifier for the npm ecosystem (matches the dependabot/npm_and_yarn/
        # branch prefix) -- distinct from the 'npm' package-ecosystem key
        # used in .github/dependabot.yml.
        if: >-
          steps.metadata.outputs.alert-state == 'OPEN' &&
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          steps.metadata.outputs.dependency-type == 'direct:production' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge routine patch-level updates
        # See package-ecosystem note above (#612).
        if: >-
          steps.metadata.outputs.alert-state != 'OPEN' &&
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-type == 'direct:production'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
