---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {} # allows release.yml and weekly-security.yml to call this

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  # A permissions block REPLACES the default set rather than adding to it, so an
  # omitted scope is 'none'. Without contents:read every job here ran
  # actions/checkout with no read access to this repository -- which worked only
  # because the repository is public and a public clone needs no credential. The
  # declared set now matches the access the workflow actually exercises.
  contents: read
  # The contract-check jobs pull the backend image from ghcr.io.
  packages: read

jobs:
  # ── Lint ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend

      # Runs before the ESLint pass, and from the repository root rather than frontend/.
      #
      # PREVENTIVE layer: it stops a CI-skip directive reaching a workflow or action file
      # at all. Deliberately not the only layer -- it is a check, and the directive it
      # looks for is the thing that stops checks running, so a PR already carrying one in
      # its head commit skips this job along with every other. The suppression-immune half
      # lives in pr-ci-presence.yml, on a schedule, where no commit message can reach it.
      #
      # Needs frontend/node_modules, so it runs after setup-frontend: the scanner parses
      # the YAML and tests resolved string values, because four different spellings of the
      # same directive all resolve to the live one while defeating a source-text regex.
      # Without the parser it exits 2 rather than reporting clean.
      - name: No CI-skip directives in workflow or action files
        run: node scripts/check-workflow-ci-skip.mjs

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # In the SAME job as lint, deliberately: both are "the source is in the
      # shape we agreed" and neither needs a build. A separate job would double
      # the checkout and install for one prettier invocation.
      #
      # This gate did not exist, and format:check had drifted to 65 failing
      # files on pristine main -- a script the repo ships, that nothing ran, and
      # that therefore said nothing about the tree. See #782.
      - name: Format check
        working-directory: frontend
        run: npm run format:check

  # ── Typecheck ─────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Unit Tests — sharded (4 parallel runners) ─────────
  # Each shard runs ~25% of tests + collects coverage, writing a blob to
  # .vitest-reports/blob-<shard>.json with an explicit unique filename so
  # the merge job can combine them. Coverage thresholds are disabled per
  # shard (partial coverage will always be below the configured floor);
  # the unit-test-coverage merge job re-enforces them on the combined data.
  unit-test:
    name: Unit Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # hardening-exception: egress-audit — this job transfers artifacts through the
      #   Actions API and clones this repository; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend

      - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        working-directory: frontend
        run: >-
          npx vitest run --coverage
          --reporter=blob
          --reporter=default
          --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json
          --shard=${{ matrix.shard }}/${STRATEGY_JOB_TOTAL}
          --coverage.thresholds.statements=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.lines=0
        env:
          STRATEGY_JOB_TOTAL: ${{ strategy.job-total }}

      - name: List blob reports (debug)
        if: always()
        working-directory: frontend
        run: ls -la .vitest-reports/ || echo "no .vitest-reports/ directory"

      - name: Upload blob report
        # always(): a shard that FAILED is the one whose report is worth reading.
        # Without this the upload is skipped exactly when it matters, and the
        # blob reporter writes nothing to stdout -- so a red shard left no
        # failure detail anywhere at all.
        if: always()
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest-reports/blob-${{ matrix.shard }}.json
          if-no-files-found: error

  # ── Unit Test Coverage (merge blob shards) ────────────
  # Downloads all 4 shard blobs, merges them with `vitest --merge-reports`,
  # produces combined coverage, applies real thresholds, and updates badge.
  unit-test-coverage:
    name: Unit Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-test
    steps:
      # hardening-exception: egress-audit — this job transfers artifacts through the
      #   Actions API and clones this repository; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend

      - name: Download blob reports
        # v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-*
          path: frontend/.vitest-reports/
          merge-multiple: true

      - name: List downloaded blobs (debug)
        working-directory: frontend
        run: ls -la .vitest-reports/

      - name: Merge reports and generate coverage
        working-directory: frontend
        # `--merge-reports=<path>` is a CLI flag in vitest v4 (the subcommand
        # form `vitest merge-reports` is parsed as a test name filter and
        # falls through to a "no test files found" error).
        run: npx vitest --merge-reports=.vitest-reports --reporter=verbose --coverage

      - name: Upload coverage report
        if: always()
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: frontend/coverage/

      - name: Compute coverage badge inputs
        # Only update the badge on pushes to main or manual dispatch — not on PRs or workflow_call.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: badge
        working-directory: frontend
        run: |
          COVERAGE=$(node -e "
            const r = require('./coverage/coverage-summary.json');
            console.log(r.total.statements.pct);
          ")
          echo "percent=${COVERAGE}" >> $GITHUB_OUTPUT
          if awk "BEGIN {exit !(${COVERAGE} >= 80)}"; then
            echo "color=brightgreen" >> $GITHUB_OUTPUT
          elif awk "BEGIN {exit !(${COVERAGE} >= 70)}"; then
            echo "color=green" >> $GITHUB_OUTPUT
          elif awk "BEGIN {exit !(${COVERAGE} >= 60)}"; then
            echo "color=yellow" >> $GITHUB_OUTPUT
          else
            echo "color=red" >> $GITHUB_OUTPUT
          fi

      - name: Update coverage badge gist
        # Requires:
        #   secrets.GIST_TOKEN  — GitHub PAT with the 'gist' scope
        #   vars.COVERAGE_GIST_ID — ID of a pre-created public gist (same gist as backend, different filename)
        # The action writes / overwrites 'frontend-coverage.json' in that gist, which the
        # shields.io endpoint badge in README.md reads.
        #
        # Also gated on the token actually being present. `github.event_name`
        # alone is NOT sufficient: in a reusable workflow it reports the
        # CALLER's event, so when release.yml (tag `push`) or
        # weekly-security.yml (manual `workflow_dispatch`) calls this workflow,
        # the event test is true even though neither passes secrets — and the
        # action then fails the job with "Missing auth secret". The `env`
        # indirection exists because the `secrets` context is not available to
        # step-level `if`.
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && env.GIST_TOKEN != ''
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: frontend-coverage.json
          label: Coverage
          message: ${{ steps.badge.outputs.percent }}%
          color: ${{ steps.badge.outputs.color }}

  # ── Build ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job transfers artifacts through the
      #   Actions API and clones this repository; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist

  # ── Contract check ────────────────────────────────────
  # Spin up the backend at a pinned image tag, fetch live /swagger.json, and
  # verify every route api.ts calls actually exists on that backend. Catches
  # the "frontend calls a route that does not exist" bug class before merge.
  contract-check:
    name: Contract Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job pulls base images and pushes
      #   layers to a container registry, calls the GitHub API, and clones this
      #   repository; harden-runner has never run in this repository, so no endpoint
      #   baseline exists and a block policy written without one fails closed on its
      #   first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull contract-check images (retry transient Docker Hub timeouts)
        # postgres:16-alpine comes from Docker Hub, whose unauthenticated rate
        # limit on shared GitHub runners intermittently times out the pull. This
        # job gates e2e-gated (`needs: contract-check`), so one unretried pull
        # failure here skips the release gate entirely without ever comparing a
        # contract — see run 30734033297, where the stack never started. Retry so
        # the subsequent `compose up` finds the images cached. e2e-gated has had
        # the same guard since it started blocking releases; unlike that stack,
        # nothing here is buildable, so no --ignore-buildable is needed.
        run: |
          compose="docker compose -f deployments/docker-compose.contract-check.yml"
          for attempt in 1 2 3 4 5; do
            if $compose pull; then
              exit 0
            fi
            echo "::warning::Image pull failed (attempt ${attempt}/5); retrying in 15s..."
            sleep 15
          done
          echo "::error::Image pull failed after 5 attempts"
          exit 1

      - name: Start contract-check stack
        # Images are pre-pulled above.
        run: >-
          docker compose -f deployments/docker-compose.contract-check.yml up -d

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Backend ready"
              exit 0
            fi
            echo "  attempt $i/30 — retrying in 3s"
            sleep 3
          done
          echo "Backend did not become ready in time"
          docker compose -f deployments/docker-compose.contract-check.yml logs backend
          exit 1

      - name: Run contract check
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:8080
        run: npm run contract:check

      - name: Dump backend logs on failure
        if: failure()
        run: >-
          docker compose -f deployments/docker-compose.contract-check.yml logs backend

      - name: Tear down stack
        if: always()
        run: >-
          docker compose -f deployments/docker-compose.contract-check.yml down --volumes

  # ── E2E (gated) ───────────────────────────────────────
  e2e-gated:
    name: E2E (gated/manual)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [lint, typecheck, unit-test-coverage, build, contract-check]
    # E2E is a required gate: failures block the release pipeline. It is
    # deliberately NOT run on every pull_request — the full multi-browser
    # suite takes ~12 minutes, so it is scoped to release time plus a
    # post-merge safety net on main, not every PR.
    #
    # 'workflow_call' below can never be true and never gated anything: a
    # reusable workflow does not see its own invocation as its event_name, it
    # inherits the CALLER's (release.yml is triggered by a tag `push`, so
    # that is what this job saw on every release) -- github.ref is inherited
    # too, and a tag push's ref is refs/tags/vX.Y.Z, which matched none of
    # the three branches either. So this job silently skipped on every real
    # release, and the comment above was false the whole time -- confirmed
    # against three actual release runs (E2E showing skipped in each). See
    # sethbacon/terraform-registry-backend#883 for what that let through.
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref ==
      'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      # hardening-exception: egress-audit — this job pulls base images and pushes
      #   layers to a container registry, transfers artifacts through the Actions API,
      #   and calls the GitHub API; harden-runner has never run in this repository, so
      #   no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
        with:
          install-deps: "false"
          install-e2e-deps: "true"
          install-playwright: "true"
          playwright-browsers: "chromium firefox webkit"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test images (retry transient Docker Hub timeouts)
        # postgres:16-alpine (the postgres + seed-db services) is pulled from
        # Docker Hub, whose unauthenticated rate limit on shared GitHub runners
        # intermittently causes "context deadline exceeded" pull timeouts. Because
        # this E2E is a required release gate, that flake fails the job and blocks
        # releases. Retry the pull so the subsequent `compose up` finds the images
        # cached. The backend is pulled from ghcr.io (authenticated above) and the
        # frontend is built locally, so --ignore-buildable skips it.
        run: |
          compose="docker compose -f deployments/docker-compose.test.yml"
          for attempt in 1 2 3 4 5; do
            if $compose pull --ignore-buildable; then
              exit 0
            fi
            echo "::warning::Image pull failed (attempt ${attempt}/5); retrying in 15s..."
            sleep 15
          done
          echo "::error::Image pull failed after 5 attempts"
          exit 1

      - name: Start test compose
        # Images are pre-pulled above; this builds the frontend and starts everything.
        run: >-
          docker compose -f deployments/docker-compose.test.yml up -d

      - name: Restart backend to reconcile the freshly-seeded membership
        # seed-db (which frontend's own depends_on already waited for, above)
        # inserts the dev-admin user's organization_members row directly
        # against the shared identity tables -- it does not touch registry's
        # own role-template mirror (organization_member_roles,
        # terraform-suite-identity#206 phase 3b). That mirror is derived by
        # repositories.ReconcileMemberRoles, which registry's router.go runs
        # exactly once, synchronously, at process start -- before /health is
        # even registered -- so the FIRST boot's reconcile pass necessarily
        # ran before this seed existed. Nothing re-triggers it afterward, so
        # every accessor that reads the mirror as authoritative serves the
        # dev-admin NO role for the rest of the run: "registry has no
        # mirrored role for a membership that exists in identity" in the
        # backend's own logs, and whichever admin-gated page a Playwright
        # worker reaches first times out waiting for content that a role-less
        # session never renders (issue #875).
        #
        # docker compose restart re-runs the same one-shot reconcile a second
        # time, now against identity data that includes the seed -- exactly
        # the log line's own documented remedy ("restarting the backend
        # re-derives the mirror"). Application code is untouched; this is
        # purely a test-harness ordering fix.
        run: |
          docker compose -f deployments/docker-compose.test.yml restart backend
          echo "Waiting for backend to become healthy again..."
          backend_up=0
          for i in {1..60}; do
            code=$(curl -s http://localhost:8080/health \
              -o /dev/null -w "%{http_code}" 2>/dev/null || true)
            if [ "$code" = "200" ]; then
              echo "Backend healthy again (HTTP $code)"
              backend_up=1
              break
            fi
            sleep 3
          done
          if [ "$backend_up" -eq 0 ]; then
            echo "ERROR: backend never became healthy again after restart"
            docker compose -f deployments/docker-compose.test.yml logs backend --tail=100
            exit 1
          fi

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend on port 3000..."
          echo "(backend/postgres readiness via Docker healthchecks)"
          frontend_up=0
          for i in {1..60}; do
            code=$(curl -sk https://localhost:3000/ \
              -o /dev/null -w "%{http_code}" 2>/dev/null || true)
            if echo "$code" | grep -qE "^[23]"; then
              echo "Frontend ready (HTTP $code)"
              frontend_up=1
              break
            fi
            sleep 3
          done
          if [ "$frontend_up" -eq 0 ]; then
            echo "ERROR: frontend never became ready"
            exit 1
          fi

      - name: Run Playwright tests
        working-directory: e2e
        # workers=2 (not 4) — under heavier parallelism, Firefox occasionally
        # hangs `waitForLoadState('networkidle')` on /modules and /providers,
        # exhausting the single retry and tripping --max-failures=1. Same
        # mitigation that PR #182 originally applied; see #233 post-merge run
        # 25007086815 for the regression that prompted reverting to 2.
        #
        # Retries come from playwright.config.ts, not a --retries flag here:
        # a CLI --retries unconditionally overrides EVERY project's own
        # retries setting, including firefox/webkit's deliberately higher
        # one (verified directly against a minimal repro) -- passing it here
        # would silently put every project back on the same one-retry budget
        # regardless of what the config says.
        #
        # --max-failures is 1 everywhere EXCEPT a tag run, where it is 5.
        # A tag run is a release: release.yml calls this workflow and its
        # docker publish `needs: [guard, ci]`, so this job's result decides
        # whether an image ships for a version whose GitHub release
        # release-please has already published. On the v2.27.0 tag run
        # (33581395968) one slow Firefox test exhausted its retries and
        # --max-failures=1 ended the run at "1 failed, 8 flaky, 171 did not
        # run" -- which is the one report that cannot answer the only question
        # a release needs answered: is this a flaky runner or a real
        # regression? Letting the suite continue past the first exhausted
        # failure answers it, at the cost of a longer red run.
        #
        # 5, not unlimited: a genuinely broken release should still stop
        # rather than retry its way through 500 test attempts inside a 40
        # minute job, and five independent failures already prove the point
        # that one does not. This does NOT unblock the publish -- any failure
        # still fails the job and still gates the image, deliberately; it only
        # makes the failing run diagnosable without a re-run.
        #
        # Set here rather than in playwright.config.ts's `maxFailures` because
        # this CLI flag overrides that field unconditionally (the same trap the
        # --retries note above describes), so raising the config field would
        # have had no effect on either E2E job while this flag is passed. The
        # sibling chromium-only security-subset job keeps its own hard-coded
        # --max-failures=1: it is PR-scoped and never gates a release.
        env:
          MAX_FAILURES: ${{ startsWith(github.ref, 'refs/tags/') && '5' || '1' }}
        run: >-
          npx playwright test --workers=2 --max-failures="$MAX_FAILURES"
          --reporter=list --grep-invert="Visual regression"

      - name: Upload Playwright artifacts
        # always() — without it this step inherits the default success()
        # condition, so the traces/videos/screenshots are uploaded only when the
        # suite passes and are missing from exactly the runs that need them.
        if: always()
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report

      - name: Dump container logs
        if: failure()
        run: |
          for svc in backend seed-db frontend postgres; do
            echo "===== $svc ====="
            docker compose \
              -f deployments/docker-compose.test.yml \
              logs "$svc" || true
          done

      - name: Tear down test compose
        if: always()
        run: >-
          docker compose -f deployments/docker-compose.test.yml down --volumes

  # ── E2E security subset (PR-gated) ───────────────────────
  # security.spec.ts (the XSS/CSRF/open-redirect abuse suite) previously only
  # ran via e2e-gated above, whose `if:` skips normal pull_request events --
  # so a regression in one of those controls could only ever be caught AFTER
  # it merged to main (#604). Run just this spec, on a single browser, on
  # every PR so the highest-value security coverage actually gates merge;
  # the full multi-browser suite stays release-gated in e2e-gated to keep
  # routine PR CI fast.
  e2e-security:
    name: E2E (security subset)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, unit-test-coverage, build, contract-check]
    if: github.event_name == 'pull_request'

    steps:
      # hardening-exception: egress-audit — this job pulls base images and pushes
      #   layers to a container registry, transfers artifacts through the Actions API,
      #   and calls the GitHub API; harden-runner has never run in this repository, so
      #   no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
        with:
          install-deps: "false"
          install-e2e-deps: "true"
          install-playwright: "true"
          playwright-browsers: "chromium"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test images (retry transient Docker Hub timeouts)
        # See e2e-gated's identical step above for the rationale.
        run: |
          compose="docker compose -f deployments/docker-compose.test.yml"
          for attempt in 1 2 3 4 5; do
            if $compose pull --ignore-buildable; then
              exit 0
            fi
            echo "::warning::Image pull failed (attempt ${attempt}/5); retrying in 15s..."
            sleep 15
          done
          echo "::error::Image pull failed after 5 attempts"
          exit 1

      - name: Start test compose
        # Images are pre-pulled above; this builds the frontend and starts everything.
        run: >-
          docker compose -f deployments/docker-compose.test.yml up -d

      - name: Restart backend to reconcile the freshly-seeded membership
        # seed-db (which frontend's own depends_on already waited for, above)
        # inserts the dev-admin user's organization_members row directly
        # against the shared identity tables -- it does not touch registry's
        # own role-template mirror (organization_member_roles,
        # terraform-suite-identity#206 phase 3b). That mirror is derived by
        # repositories.ReconcileMemberRoles, which registry's router.go runs
        # exactly once, synchronously, at process start -- before /health is
        # even registered -- so the FIRST boot's reconcile pass necessarily
        # ran before this seed existed. Nothing re-triggers it afterward, so
        # every accessor that reads the mirror as authoritative serves the
        # dev-admin NO role for the rest of the run: "registry has no
        # mirrored role for a membership that exists in identity" in the
        # backend's own logs, and whichever admin-gated page a Playwright
        # worker reaches first times out waiting for content that a role-less
        # session never renders (issue #875).
        #
        # docker compose restart re-runs the same one-shot reconcile a second
        # time, now against identity data that includes the seed -- exactly
        # the log line's own documented remedy ("restarting the backend
        # re-derives the mirror"). Application code is untouched; this is
        # purely a test-harness ordering fix.
        run: |
          docker compose -f deployments/docker-compose.test.yml restart backend
          echo "Waiting for backend to become healthy again..."
          backend_up=0
          for i in {1..60}; do
            code=$(curl -s http://localhost:8080/health \
              -o /dev/null -w "%{http_code}" 2>/dev/null || true)
            if [ "$code" = "200" ]; then
              echo "Backend healthy again (HTTP $code)"
              backend_up=1
              break
            fi
            sleep 3
          done
          if [ "$backend_up" -eq 0 ]; then
            echo "ERROR: backend never became healthy again after restart"
            docker compose -f deployments/docker-compose.test.yml logs backend --tail=100
            exit 1
          fi

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend on port 3000..."
          echo "(backend/postgres readiness via Docker healthchecks)"
          frontend_up=0
          for i in {1..60}; do
            code=$(curl -sk https://localhost:3000/ \
              -o /dev/null -w "%{http_code}" 2>/dev/null || true)
            if echo "$code" | grep -qE "^[23]"; then
              echo "Frontend ready (HTTP $code)"
              frontend_up=1
              break
            fi
            sleep 3
          done
          if [ "$frontend_up" -eq 0 ]; then
            echo "ERROR: frontend never became ready"
            exit 1
          fi

      - name: Run Playwright security tests
        working-directory: e2e
        # chromium only here, so this specific job never actually hit the
        # CLI --retries-overrides-every-project trap (see the other E2E
        # job's comment) -- but a --retries flag here would silently spring
        # it the moment this job's project list grows to include firefox or
        # webkit, so it's left off in favor of the root retries: 1 in
        # playwright.config.ts, same as the other job.
        run: >-
          npx playwright test tests/security.spec.ts --project=chromium
          --workers=2 --max-failures=1 --reporter=list

      - name: Upload Playwright artifacts
        # always() — see the identical step in e2e-gated above for the rationale.
        if: always()
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-security
          path: e2e/playwright-report

      - name: Dump container logs
        if: failure()
        run: |
          for svc in backend seed-db frontend postgres; do
            echo "===== $svc ====="
            docker compose \
              -f deployments/docker-compose.test.yml \
              logs "$svc" || true
          done

      - name: Tear down test compose
        if: always()
        run: >-
          docker compose -f deployments/docker-compose.test.yml down --volumes
