---
name: PR Checks

# Validates PR hygiene on all branches targeting main.
"on":
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  # ── Conventional Commit PR title ──────────────────────
  conventional-title:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title follows Conventional Commits
        # v6.1.1
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
            security
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: >-
            The PR title must have a non-empty description after the type
            (e.g. "feat: add login page", not "feat:").

  # ── Dependency review ─────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Review dependency changes
        # v5.0.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # ── Dependency Audit (npm audit) ───────────────────────
  # dependency-review-action above only sees the PR's own manifest diff
  # against the GitHub Advisory Database. Without this job, a full audit of
  # the resolved dependency tree only ran on weekly-security.yml's Monday
  # cron, leaving up to a 6-day blind spot for anything not yet GHSA-listed.
  # Same command already used in the Docker build and the weekly workflow.
  #
  # NOT a required branch-protection check yet -- frontend/ currently carries
  # pre-existing high-severity advisories (brace-expansion via the eslint
  # toolchain, react-router via the direct react-router-dom dependency) with
  # no non-breaking fix available, so this job fails today regardless of PR
  # content. See SECURITY.md's Branch Protection section. Promote to
  # required once those clear via the normal Dependabot update flow.
  npm-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # setup-frontend's default `npm ci` in frontend/ authenticates to
      # npm.pkg.github.com (frontend/.npmrc) with github.token to resolve
      # @sethbacon/terraform-suite-ui. A job-level `permissions:` block
      # zeroes out unlisted scopes, so packages:read must be explicit here
      # (#598) -- matches ci.yml's workflow-level grant for the same reason.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-frontend
        with:
          install-e2e-deps: "true"

      # Triaged rather than raw: `npm audit` exits non-zero for ANY high
      # advisory, including ones this PR cannot act on (dev-only packages that
      # never ship, advisories whose only published fix is a breaking major, and
      # documented accepted risks). Gating merges on those pins the check red
      # regardless of what changed, and a permanently-red required check is one
      # everybody learns to ignore. Blocking is reserved for advisories that
      # reach production AND have a non-breaking fix; everything else is a
      # warning + job summary. Accepted risks live in
      # scripts/npm-audit-exceptions.json with a rationale and a review date.
      - name: Audit frontend dependencies
        run: |
          (cd frontend && npm audit --json > "$RUNNER_TEMP/frontend-audit.json") || true
          node frontend/scripts/audit-gate.mjs "$RUNNER_TEMP/frontend-audit.json" \
            --exceptions frontend/scripts/npm-audit-exceptions.json

      - name: Audit e2e dependencies
        run: |
          (cd e2e && npm audit --json > "$RUNNER_TEMP/e2e-audit.json") || true
          node frontend/scripts/audit-gate.mjs "$RUNNER_TEMP/e2e-audit.json" \
            --exceptions frontend/scripts/npm-audit-exceptions.json


  # ── Breaking-change declarations survive the squash ────
  # This repository squash-merges with
  # squash_merge_commit_message=COMMIT_MESSAGES, so every commit body in a PR
  # is concatenated into ONE merge commit. release-please then keeps only the
  # FIRST `BREAKING CHANGE:` footer of that commit, and reads a `!` marker only
  # from its header. A second declaration anywhere in the PR is therefore
  # dropped in silence: the change ships with no changelog entry, no upgrade
  # note, and nothing failing to say so.
  #
  # This is not hypothetical. terraform-registry-backend v4.0.0 shipped two
  # undocumented breaking changes this way -- including one that breaks CI
  # tokens -- and terraform-state-manager-backend 3.1.0 lost three before the
  # release was cut.
  #
  # Splitting the footers across separate commits does not help; the squash
  # concatenates them back. One merged commit can announce exactly one breaking
  # change. Either open one PR per breaking change, or combine them into a
  # single footer and write each up in the upgrade guide.
  breaking-change-footers:
    name: Breaking-change footers survive the squash
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Count breaking-change declarations across this PR's commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | {sha: .sha[0:7], msg: .commit.message}' > commits.ndjson

          total=0
          report=""
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            sha=$(jq -r '.sha' <<<"$line")
            msg=$(jq -r '.msg' <<<"$line")
            subject=$(head -n1 <<<"$msg")

            # Spec allows both spellings of the footer token.
            footers=$(grep -cE '^BREAKING[ -]CHANGE:' <<<"$msg" || true)
            if [ "$footers" -gt 0 ]; then
              # A footer wins over the header's `!`, so they are not additive.
              n="$footers"
            elif printf '%s' "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
              n=1
            else
              n=0
            fi

            if [ "$n" -gt 0 ]; then
              report="${report}  ${sha}  ${n} declaration(s)  ${subject}"$'\n'
            fi
            total=$((total + n))
          done < commits.ndjson

          echo "Breaking-change declarations in this PR: $total"
          if [ -n "$report" ]; then
            printf 'Where they are:\n%s' "$report"
          fi

          if [ "$total" -le 1 ]; then
            echo "OK: at most one declaration, so the squash loses nothing."
            exit 0
          fi

          {
            echo "### Breaking-change declarations do not survive the squash"
            echo
            echo "This PR declares **$total** breaking changes. The squash-merge"
            echo "concatenates every commit body into one commit, and release-please"
            echo "keeps only the **first** \`BREAKING CHANGE:\` footer of a commit."
            echo "The other $((total - 1)) would ship with no changelog entry and no notice."
            echo
            echo '```'
            printf '%s' "$report"
            echo '```'
            echo
            echo "Two ways out:"
            echo
            echo "1. **One PR per breaking change.** Preferred when they are independent."
            echo "2. **One footer.** Combine the declarations into a single"
            echo "   \`BREAKING CHANGE:\` footer and write each one up in the upgrade"
            echo "   guide, which is where an operator preparing an upgrade looks."
            echo
            echo "Moving the footers into separate commits within this PR does **not**"
            echo "work -- the squash concatenates them back into one commit body."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::This PR declares $total breaking changes; the squash keeps only the first. See the job summary."
          exit 1
