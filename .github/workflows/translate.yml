# Translation sync — DeepL
#
# Prerequisites — configure these secrets in GitHub repository settings:
#   DEEPL_API_KEY  — DeepL API key (free or pro tier)
#
# On push to main:   translate new/changed English strings and open a PR.
# Manual dispatch:   trigger a full translation sync on demand.

name: Translate — DeepL

"on":
  push:
    branches: [ main ]
    paths:
      - "frontend/src/locales/en/translation.json"
  workflow_dispatch:

jobs:
  translate:
    name: Translate and open PR
    runs-on: ubuntu-latest
    # GITHUB_TOKEN only needs to read the tree. The branch push and the pull
    # request are made with a GitHub App token minted below, because this
    # repository's default workflow permissions are read-only and a workflow
    # cannot grant itself more than the default allows -- declaring
    # `contents: write` here did not confer it, it just made the refusal
    # look like a mystery.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] -- opens the translations PR

      - name: Mint a token for the translations branch and PR
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "${{ vars.TRANSLATE_APP_ID }}"
          private-key: "${{ secrets.TRANSLATE_APP_KEY }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Translate all locales via DeepL
        run: node scripts/translate.mjs --all
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Create PR with translations
        # v8.1.1
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: "${{ steps.app-token.outputs.token }}"
          branch: i18n/auto-translate
          title: "chore(i18n): update translations"
          body: |
            Auto-generated by the translation workflow (DeepL).

            **Review checklist:**
            - [ ] Spot-check a few strings in each language for accuracy
            - [ ] No English source strings appear verbatim in non-English files
            - [ ] Interpolation tokens (`{{name}}`) are preserved correctly
          commit-message: "chore(i18n): update translations [skip ci]"
          delete-branch: true
